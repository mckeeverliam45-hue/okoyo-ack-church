<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Okoyo Church Admin</title><link rel="stylesheet" href="styles.css"><style>.admin{max-width:1150px;margin:auto;padding:45px 5%}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;margin:20px 0;box-shadow:0 10px 30px rgba(16,23,43,.06)}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.danger{background:#ffe7e7;border:0;padding:8px 12px;border-radius:8px}.small{font-size:12px;color:var(--muted)}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}}</style></head><body><header class="nav"><a class="brand" href="/"><span class="cross">✝</span><span><b>ACK OKOYO</b><small>ADMIN</small></span></a><a href="/" class="btn ghost" style="background:#162a67">View Website</a></header><main class="admin"><h1>Church Administration</h1><p class="small">Update the public website, service programme and gallery. Change the default admin password before deployment.</p><div id="login" class="panel"><h2>Admin Login</h2><form id="loginForm" class="form"><input name="username" value="admin" placeholder="Username"><input name="password" type="password" placeholder="Password"><button class="btn primary">Login</button><p id="loginMsg" class="form-msg"></p></form></div><div id="dashboard" style="display:none"><div class="admin-grid"><section class="panel"><h2>Site content</h2><form id="contentForm" class="form"><label>Hero title<input name="hero_title"></label><label>Hero subtitle<textarea name="hero_subtitle" rows="3"></textarea></label><label>Mission<textarea name="mission" rows="3"></textarea></label><label>Vision<textarea name="vision" rows="3"></textarea></label><label>History<textarea name="history" rows="8"></textarea></label><label>YouTube URL<input name="youtube"></label><button class="btn primary">Save content</button><p id="contentMsg" class="form-msg"></p></form></section><section class="panel"><h2>Add order of service</h2><form id="serviceForm" class="form"><input name="service_date" type="date" required><input name="title" placeholder="Service title" required><input name="time" placeholder="Time e.g. 8:00 AM – 11:00 AM"><input name="minister" placeholder="Minister / preacher"><textarea name="items" rows="8" placeholder="One service item per line"></textarea><button class="btn primary">Publish service</button><p id="serviceMsg" class="form-msg"></p></form></section></div><section class="panel"><h2>Current services</h2><div id="services" class="table"></div></section><section class="panel"><h2>Upload pictorial</h2><form id="galleryForm" class="form"><input name="title" placeholder="Photo title" required><input name="caption" placeholder="Caption"><input name="image" type="file" accept="image/jpeg,image/png,image/webp" required><button class="btn primary">Upload image</button><p id="galleryMsg" class="form-msg"></p></form><div id="gallery" class="table"></div></section><div class="admin-grid"><section class="panel"><h2>Giving records</h2><div id="giving" class="table"></div></section><section class="panel"><h2>Messages</h2><div id="messages" class="table"></div></section></div></div></main><script src="admin.js"></script></body></html>
