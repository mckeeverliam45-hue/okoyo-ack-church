    <!-- =====================================================
         VISUAL ENHANCEMENTS ONLY
         These styles are contained inside this page.
         They do not replace your existing styles.css.

    <style>

        /* ------------------------------
           ACCESSIBILITY: REDUCED MOTION
        ------------------------------ */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }


        /* ------------------------------
           CREATIVE PAGE VARIABLES
        ------------------------------ */

        :root {
            --creative-blue: #172554;
            --creative-blue-2: #1e3a8a;
            --creative-gold: #f59e0b;
            --creative-light: #f8fafc;
            --creative-white: #ffffff;
            --creative-text: #1e293b;
            --creative-green: #15803d;
        }


        /* ------------------------------
           ANNOUNCEMENT MARQUEE
        ------------------------------ */

        .church-marquee {
            background: linear-gradient(
                90deg,
                #172554,
                #1e3a8a,
                #172554
            );

            color: white;
            overflow: hidden;
            white-space: nowrap;
            border-bottom: 1px solid rgba(255,255,255,.15);
        }

        .marquee-track {
            display: inline-flex;
            gap: 45px;
            min-width: max-content;
            padding: 11px 0;
            animation: churchMarquee 28s linear infinite;
        }

        .marquee-item {
            font-weight: 600;
            letter-spacing: .4px;
        }

        .marquee-item span {
            color: #fbbf24;
            margin-right: 8px;
        }

        @keyframes churchMarquee {

            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }

        }


        /* ------------------------------
           HERO ENHANCEMENT
        ------------------------------ */

        .hero {
            position: relative;
            overflow: hidden;
        }

        .hero::before,
        .hero::after {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: rgba(255,255,255,.08);
            animation: floatingCircle 8s ease-in-out infinite;
            pointer-events: none;
        }

        .hero::before {
            top: 8%;
            left: -120px;
        }

        .hero::after {
            right: -120px;
            bottom: 5%;
            animation-delay: 2s;
        }

        @keyframes floatingCircle {

            0%,100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-25px) scale(1.08);
            }

        }


        /* ------------------------------
           FLOATING CROSSES
        ------------------------------ */

        .floating-cross {
            position: absolute;
            color: rgba(255,255,255,.25);
            font-size: 35px;
            animation: floatCross 6s ease-in-out infinite;
            pointer-events: none;
            aria-hidden: "true";
        }

        .cross-one {
            top: 15%;
            left: 8%;
        }

        .cross-two {
            top: 35%;
            right: 10%;
            animation-delay: 2s;
        }

        .cross-three {
            bottom: 15%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes floatCross {

            0%,100% {
                transform: translateY(0) rotate(0deg);
                opacity: .25;
            }

            50% {
                transform: translateY(-20px) rotate(8deg);
                opacity: .55;
            }

        }


        /* ------------------------------
           WELCOME BADGE
        ------------------------------ */

        .welcome-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 17px;
            border-radius: 50px;
            background: rgba(255,255,255,.13);
            border: 1px solid rgba(255,255,255,.25);
            backdrop-filter: blur(8px);
            margin-bottom: 18px;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .welcome-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #fbbf24;
            box-shadow: 0 0 14px #fbbf24;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {

            0%,100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.5);
                opacity: .6;
            }

        }


        /* ------------------------------
           VERSE CARD
        ------------------------------ */

        .verse {
            position: relative;
            margin-top: 28px;
            padding: 16px 22px;
            border-left: 3px solid #fbbf24;
            background: rgba(0,0,0,.15);
            backdrop-filter: blur(7px);
            border-radius: 0 14px 14px 0;
        }


        /* ------------------------------
           LIVE INDICATOR
        ------------------------------ */

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            font-size: 13px;
            opacity: .9;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: pulseDot 1.2s infinite;
        }


        /* ------------------------------
           QUICK INFORMATION
        ------------------------------ */

        .quick {
            position: relative;
            z-index: 5;
        }

        .quick > div {
            transition: transform .3s ease, box-shadow .3s ease;
        }

        .quick > div:hover {
            transform: translateY(-7px);
            box-shadow: 0 15px 35px rgba(15,23,42,.15);
        }


        /* ------------------------------
           SECTION LABEL
        ------------------------------ */

        .creative-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 30px;
            background: rgba(30,58,138,.08);
            color: #1e3a8a;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .creative-label::before {
            content: "✦";
            color: #f59e0b;
        }


        /* ------------------------------
           FEATURED MOMENTS
        ------------------------------ */

        .moments-section {
            padding: 80px 5%;
            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(30,58,138,.07),
                    transparent 30%
                ),
                #f8fafc;
        }

        .moments-title {
            text-align: center;
            max-width: 760px;
            margin: 0 auto 40px;
        }

        .moments-title h2 {
            font-size: clamp(30px, 4vw, 48px);
            margin: 8px 0 14px;
            color: #172554;
        }

        .moments-title p {
            color: #64748b;
        }

        .moment-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1250px;
            margin: auto;
        }

        .moment-card {
            position: relative;
            min-height: 280px;
            overflow: hidden;
            border-radius: 22px;
            background: #172554;
            box-shadow: 0 12px 35px rgba(15,23,42,.12);
        }

        .moment-card img {
            width: 100%;
            height: 100%;
            min-height: 280px;
            object-fit: cover;
            transition: transform .7s ease;
            loading: lazy;
        }

        .moment-card:hover img {
            transform: scale(1.1);
        }

        .moment-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
            color: white;
            background: linear-gradient(
                transparent 30%,
                rgba(2,6,23,.9)
            );
        }

        .moment-overlay span {
            color: #fbbf24;
            font-size: 25px;
        }

        .moment-overlay h3 {
            margin: 6px 0;
        }

        .moment-overlay p {
            margin: 0;
            opacity: .85;
            font-size: 14px;
        }


        /* ------------------------------
           CHURCH PILLARS
        ------------------------------ */

        .pillars {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 45px auto 0;
        }

        .pillar {
            text-align: center;
            padding: 28px 18px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(15,23,42,.08);
            transition: .3s ease;
        }

        .pillar:hover {
            transform: translateY(-8px);
        }

        .pillar-icon {
            width: 65px;
            height: 65px;
            margin: auto auto 15px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #eff6ff;
            font-size: 28px;
            aria-hidden: "true";
        }

        .pillar h3 {
            color: #172554;
        }

        .pillar p {
            color: #64748b;
            font-size: 14px;
        }


        /* ------------------------------
           SCRIPTURE SECTION
        ------------------------------ */

        .scripture-section {
            position: relative;
            overflow: hidden;
            padding: 90px 5%;
            color: white;
            text-align: center;
            background:
                linear-gradient(
                    135deg,
                    rgba(23,37,84,.96),
                    rgba(30,58,138,.94)
                );
        }

        .scripture-section::before {
            content: "✝";
            position: absolute;
            font-size: 300px;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            opacity: .04;
            aria-hidden: "true";
        }

        .scripture-icon {
            font-size: 40px;
            color: #fbbf24;
        }

        .scripture-section blockquote {
            position: relative;
            max-width: 900px;
            margin: 20px auto;
            font-size: clamp(23px,3vw,38px);
            line-height: 1.4;
            font-weight: 500;
        }

        .scripture-reference {
            color: #fbbf24;
            font-weight: 700;
        }


        /* ------------------------------
           STATISTICS
        ------------------------------ */

        .church-stats {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            max-width: 1100px;
            margin: -35px auto 0;
            position: relative;
            z-index: 5;
            background: white;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(15,23,42,.13);
            overflow: hidden;
        }

        .stat {
            text-align: center;
            padding: 30px 15px;
            border-right: 1px solid #e2e8f0;
        }

        .stat:last-child {
            border-right: none;
        }

        .stat-number {
            font-size: 34px;
            font-weight: 900;
            color: #1e3a8a;
        }

        .stat-label {
            color: #64748b;
            font-size: 13px;
            margin-top: 5px;
        }


        /* ------------------------------
           PRAYER SECTION
        ------------------------------ */

        .prayer-section {
            padding: 85px 5%;
            background: #fff;
        }

        .prayer-box {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(15,23,42,.12);
        }

        .prayer-content {
            padding: 55px;
            background: #172554;
            color: white;
        }

        .prayer-content h2 {
            font-size: 36px;
        }

        .prayer-content p {
            line-height: 1.8;
            opacity: .85;
        }

        .prayer-icon-large {
            font-size: 60px;
            color: #fbbf24;
            aria-hidden: "true";
        }

        .prayer-side {
            min-height: 350px;
            background:
                linear-gradient(
                    rgba(15,23,42,.25),
                    rgba(15,23,42,.6)
                ),
                url("assets/church-service.jpg") center/cover;
            display: grid;
            place-items: center;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .prayer-side-inner {
            background: rgba(0,0,0,.35);
            backdrop-filter: blur(7px);
            padding: 30px;
            border-radius: 20px;
        }


        /* ------------------------------
           EVENTS
        ------------------------------ */

        .events-section {
            padding: 85px 5%;
            background: #f8fafc;
        }

        .events-container {
            max-width: 1100px;
            margin: auto;
        }

        .event-card {
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 22px;
            margin-bottom: 15px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(15,23,42,.07);
            transition: .3s ease;
        }

        .event-card:hover {
            transform: translateX(8px);
        }

        .event-icon {
            min-width: 65px;
            height: 65px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: #eff6ff;
            font-size: 27px;
            aria-hidden: "true";
        }

        .event-card h3 {
            margin: 0 0 5px;
            color: #172554;
        }

        .event-card p {
            margin: 0;
            color: #64748b;
        }


        /* ------------------------------
           PHOTO STRIP
        ------------------------------ */

        .photo-strip {
            display: flex;
            width: 100%;
            overflow: hidden;
            height: 190px;
        }

        .photo-strip img {
            width: 25%;
            min-width: 25%;
            object-fit: cover;
            filter: saturate(.85);
            transition: .5s ease;
            loading: lazy;
        }

        .photo-strip img:hover {
            width: 35%;
            min-width: 35%;
            filter: saturate(1.2);
        }


        /* ------------------------------
           GALLERY VISUAL EFFECT
        ------------------------------ */

        .gallery img {
            transition:
                transform .4s ease,
                filter .4s ease,
                box-shadow .4s ease;
            loading: lazy;
        }

        .gallery img:hover {
            transform: scale(1.035);
            filter: brightness(1.06);
            box-shadow: 0 18px 40px rgba(15,23,42,.2);
        }


        /* ------------------------------
           GIVING ENHANCEMENT
        ------------------------------ */

        .give {
            position: relative;
            overflow: hidden;
        }

        .give::before {
            content: "✝";
            position: absolute;
            right: 5%;
            top: 10%;
            font-size: 170px;
            color: rgba(30,58,138,.04);
            aria-hidden: "true";
        }


        /* ------------------------------
           CONTACT ENHANCEMENT
        ------------------------------ */

        .contact-grid > * {
            transition: transform .3s ease;
        }

        .contact-grid > *:hover {
            transform: translateY(-5px);
        }


        /* ------------------------------
           FLOATING ACTION BUTTONS
        ------------------------------ */

        .floating-actions {
            position: fixed;
            right: 20px;
            bottom: 22px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .floating-action {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #172554;
            color: white;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(0,0,0,.2);
            transition: .3s ease;
        }

        .floating-action:hover {
            transform: scale(1.12);
            background: #1e3a8a;
        }


        /* ------------------------------
           FOOTER GLOW
        ------------------------------ */

        footer {
            position: relative;
            overflow: hidden;
        }

        footer::before {
            content: "";
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: rgba(255,255,255,.04);
            top: -120px;
            left: 10%;
            aria-hidden: "true";
        }


        /* ------------------------------
           RESPONSIVE
        ------------------------------ */

        @media (max-width: 1000px) {

            .moment-grid {
                grid-template-columns: repeat(2,1fr);
            }

            .pillars {
                grid-template-columns: repeat(2,1fr);
            }

            .church-stats {
                grid-template-columns: repeat(2,1fr);
            }

            .stat:nth-child(2) {
                border-right: none;
            }

        }


        @media (max-width: 700px) {

            .moment-grid {
                grid-template-columns: 1fr;
            }

            .pillars {
                grid-template-columns: 1fr;
            }

            .church-stats {
                grid-template-columns: 1fr 1fr;
                margin-left: 15px;
                margin-right: 15px;
            }

            .stat {
                border-right: none;
                border-bottom: 1px solid #e2e8f0;
            }

            .prayer-box {
                grid-template-columns: 1fr;
            }

            .prayer-content {
                padding: 35px 25px;
            }

            .event-card {
                align-items: flex-start;
            }

            .photo-strip {
                height: 130px;
            }

            .photo-strip img {
                min-width: 50%;
                width: 50%;
            }

            .photo-strip img:nth-child(n+3) {
                display: none;
            }

            .floating-actions {
                right: 12px;
                bottom: 15px;
            }

        }

    </style>

</head>

    <div class="marquee-track">

        <div class="marquee-item">
            <span>✝</span> Welcome to ACK Okoyo Church
        </div>
